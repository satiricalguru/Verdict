version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:./dev.db
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-verdict-production-encryption-key-32b-secret}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-verdict-super-secret-key-12345}
      NEXTAUTH_URL: http://localhost:3000
      ENGINE_URL: http://engine:8000
    depends_on:
      - engine

  engine:
    build:
      context: .
      dockerfile: Dockerfile.engine
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: file:./dev.db
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-verdict-production-encryption-key-32b-secret}
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile.engine
    command: celery -A tasks worker --loglevel=info
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  verdict-db:
